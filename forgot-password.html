<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — SovereignTrust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<script src="/js/auth.js"></script>
<script>redirectIfAuthed();</script>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <div class="nav-logo-mark">S</div>
    <div class="nav-logo-text">Sovereign Trust</div>
  </a>
  <div class="nav-links" id="navLinks">
    <a class="nav-link" href="/education.html">Education</a>
    <a class="nav-link" href="/settings.html">Settings</a>
    <a class="nav-link" href="/login.html">Sign in</a>
    <a class="nav-cta" href="/register.html">Create Account</a>
  </div>
  <button class="nav-hamburger" onclick="toggleMobileMenu()" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="auth-wrap">
  <div class="auth-card" id="requestCard">
    <div class="auth-header">
      <div class="nav-logo-mark" style="margin:0 auto 16px; width:40px; height:40px; font-size:20px;">S</div>
      <h2>Forgot your password?</h2>
      <p>Enter your email address and we'll send you a reset link.</p>
    </div>

    <div class="alert-error" id="fpError"></div>

    <div class="field-group">
      <label class="field-label" for="fpEmail">Email address</label>
      <input id="fpEmail" type="email" class="field-input" placeholder="you@example.com" autocomplete="email">
    </div>

    <button id="fpBtn" class="btn-block" onclick="handleForgotPassword()">Send Reset Link</button>

    <div class="auth-footer">
      <a href="/login.html">Back to sign in</a>
    </div>
    <div style="text-align: center; margin-top:20px;"><img src="/img/PoweredByTheOASISTrans.png" height="77" alt="Powered By The OASIS Logo"></div>
  </div>

  <div class="auth-card" id="successCard" style="display:none;">
    <div class="auth-header">
      <div class="nav-logo-mark" style="margin:0 auto 16px; width:40px; height:40px; font-size:20px;">S</div>
      <h2>Check your email</h2>
      <p>If an account exists for that address, you'll receive a password reset link shortly.</p>
    </div>
    <div class="auth-footer" style="text-align:center;">
      <a href="/login.html">Back to sign in</a>
    </div>
    <div style="text-align: center; margin-top:20px;"><img src="/img/PoweredByTheOASISTrans.png" height="77" alt="Powered By The OASIS Logo"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  async function handleForgotPassword() {
    const email   = document.getElementById('fpEmail').value.trim();
    const btn     = document.getElementById('fpBtn');
    const errorEl = document.getElementById('fpError');

    errorEl.textContent = '';

    if (!email) {
      errorEl.textContent = 'Please enter your email address.';
      return;
    }

    btn.textContent = 'Sending…';
    btn.disabled = true;

    try {
      await fetch('/api/auth-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'forgot', email })
      });

      // Always show success to prevent email enumeration
      document.getElementById('requestCard').style.display = 'none';
      document.getElementById('successCard').style.display = '';

    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please try again.';
      btn.textContent = 'Send Reset Link';
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleForgotPassword();
  });
</script>
</body>
</html>
